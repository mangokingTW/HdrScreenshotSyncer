name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive version
        shell: pwsh
        run: |
          $full = $env:TAG -replace '^v', ''
          if ($full -notmatch '^\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') {
            throw "Tag '$env:TAG' is not MAJOR.MINOR.PATCH, optionally -beta.N / -alpha.N / -rc.N"
          }
          $version = $full -replace '-.*$', ''   # numeric part, for VersionInfoVersion
          $prerelease = if ($full -match '-') { 'true' } else { 'false' }
          "VERSION=$version"       | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "FILEVER=$full"          | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PRERELEASE=$prerelease" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build-x64 -A x64
          if ($LASTEXITCODE) { throw "configure x64 failed" }
          cmake --build build-x64 --config Release
          if ($LASTEXITCODE) { throw "build x64 failed" }
          cmake -S . -B build-x86 -A Win32
          if ($LASTEXITCODE) { throw "configure x86 failed" }
          cmake --build build-x86 --config Release
          if ($LASTEXITCODE) { throw "build x86 failed" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          iscc "/DAppVersion=$env:VERSION" "/DAppVersionFull=$env:FILEVER" installer\HdrScreenshotSyncer.iss
          if ($LASTEXITCODE) { throw "installer failed to compile" }

      - name: Package portable archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($arch in 'x64', 'x86') {
            $build = if ($arch -eq 'x64') { 'build-x64' } else { 'build-x86' }
            Compress-Archive `
              -Path "$build/Release/HdrScreenshotSyncer.exe", 'README.md', 'LICENSE' `
              -DestinationPath "dist/HdrScreenshotSyncer-$env:FILEVER-$arch.zip"
          }

      - name: Build Store MSIX (unsigned)
        shell: pwsh
        run: |
          # The unsigned package to upload to Partner Center -- the Store signs it
          # on ingestion. build.ps1 locates makeappx in the Windows SDK. Named with
          # the version so the maintainer grabs it straight from the release.
          & packaging\msix\build.ps1
          if ($LASTEXITCODE) { throw "MSIX packaging failed" }
          Move-Item dist/HdrScreenshotSyncer.msix "dist/HdrScreenshotSyncer-$env:FILEVER.msix" -Force

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-FileHash dist/*.zip, dist/*.exe, dist/*.msix -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $path = Join-Path $PWD 'dist/SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($path, ($lines -join "`n") + "`n")

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe
            dist/*.msix
            dist/SHA256SUMS.txt

      - name: Attach provenance to the release
        shell: pwsh
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" dist/multiple.intoto.jsonl

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: use this tag's section from CHANGELOG.md if present
          # (everything under "## <tag>" up to the next "## "), otherwise fall
          # back to notes auto-generated from the commits.
          $notesArgs = @('--generate-notes')
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s+$([regex]::Escape($env:TAG))(\s|$)") { $start = $i + 1; break }
            }
            if ($start -ge 0) {
              $body = New-Object System.Collections.Generic.List[string]
              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s') { break }
                $body.Add($lines[$i])
              }
              $text = ($body -join "`n").Trim()
              if ($text) {
                # Store "What's new": the highlights only (no install/verify
                # footer, which would be wrong for a Store listing). The Store
                # step reads this file.
                [System.IO.File]::WriteAllText("$PWD/storenotes.md", $text + "`n")
                # Split into per-language notes at the "繁體中文" marker so each
                # Store listing gets its own language (en-us -> English,
                # zh-tw -> Chinese). storenotes.md stays as the bilingual
                # fallback (used when an app has a single listing).
                $parts = $text -split "(?m)^(?=繁體中文)", 2
                $enNotes = $parts[0].Trim()
                $zhNotes = if ($parts.Count -gt 1) { ($parts[1] -replace "^繁體中文[:：]\s*", "").Trim() } else { "" }
                if ($enNotes) { [System.IO.File]::WriteAllText("$PWD/storenotes.en.md", $enNotes + "`n") }
                if ($zhNotes) { [System.IO.File]::WriteAllText("$PWD/storenotes.zh.md", $zhNotes + "`n") }
                # Wrap the per-version highlights with a consistent install /
                # verify section, so every release reads as a finished note.
                # Built as an array (not a here-string) so every line stays
                # indented inside this YAML block scalar.
                $footer = @(
                  '',
                  '---',
                  '',
                  '### Install',
                  '`scoop install mango/HdrScreenshotSyncer` · `winget install mangokingTW.HdrScreenshotSyncer` · `choco install hdrscreenshotsyncer` — or the setup / portable zip below. Verify a download with `gh attestation verify <file> --repo mangokingTW/HdrScreenshotSyncer`.',
                  '',
                  'The `.msix` asset is the Store-submission package; install via the Microsoft Store or the setup/zip.',
                  '安裝:上方任一套件管理器,或下方安裝檔／免安裝 zip。`.msix` 是供 Store 上架用,一般安裝請用商店或安裝檔。'
                ) -join "`n"
                [System.IO.File]::WriteAllText("$PWD/relnotes.md", ($text + "`n" + $footer).Trim() + "`n")
                $notesArgs = @('--notes-file', "$PWD/relnotes.md")
              }
            }
          }
          $ghArgs = @($env:TAG, '--target', $env:GITHUB_SHA, '--title', $env:TAG) + $notesArgs
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          $ghArgs += (Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create @ghArgs

      # --- Microsoft Store auto-submit --------------------------------------
      # Stable releases only, and a no-op until the PARTNER_CENTER_* secrets are
      # set, so this stays dormant until Store publishing is configured. Runs
      # after the GitHub release so a Store hiccup never blocks the release.
      - name: Store submit gate
        if: env.PRERELEASE == 'false'
        shell: pwsh
        env:
          CLIENTID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
        run: |
          if ($env:CLIENTID) {
            "HAVE_STORE=true" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Host 'PARTNER_CENTER_* secrets not set; skipping Store submission.'
          }

      - name: Set up Microsoft Store CLI
        if: env.HAVE_STORE == 'true'
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Submit MSIX to the Microsoft Store
        if: env.HAVE_STORE == 'true'
        shell: pwsh
        # msstore's commit has been seen to hang at "CommitStarted"
        # (microsoft/msstore-cli#29); bound it so a hang fails the step instead
        # of running out the job's default timeout.
        timeout-minutes: 30
        env:
          TENANT: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLERID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENTID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENTSECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $storeId = '9NS238QVJ9CS'
          $msix = "dist/HdrScreenshotSyncer-$env:FILEVER.msix"
          # The Store re-signs the package on ingestion.
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLERID --clientId $env:CLIENTID --clientSecret $env:CLIENTSECRET
          if ($LASTEXITCODE) { throw 'msstore reconfigure failed' }

          # The Store allows only one in-flight submission, so cancel any left
          # pending by an earlier release -- this newer version supersedes it.
          # Best-effort: "no pending submission" is not an error, so the result
          # is intentionally ignored (and $LASTEXITCODE reset afterwards).
          # --no-confirm: msstore prompts y/n otherwise and dies in CI with
          # "Failed to read input in non-interactive mode".
          msstore submission delete $storeId --no-confirm
          $global:LASTEXITCODE = 0

          $notesFile = "$PWD/storenotes.md"
          if (Test-Path $notesFile) {
            # `msstore publish` clones the previous submission's release notes, so
            # to set this version's "What's new" we upload the package into a
            # draft WITHOUT committing (-nc), inject the notes, then commit.
            msstore publish $msix -id $storeId -nc
            if ($LASTEXITCODE) { throw 'msstore publish (-nc) failed' }

            # Best-effort: set the notes on every listing. Any failure here just
            # means the package ships with the previous notes -- it must never
            # block the commit below, so it is wrapped and the exit code reset.
            try {
              # msstore prints the JSON via AnsiConsole, which hard-wraps to
              # ~80 cols in CI and splits \uXXXX escapes (breaks non-ASCII
              # notes). Rejoin the physical lines so the escapes are whole.
              $raw = ((msstore submission get $storeId) -join '')
              $s = $raw.IndexOf('{'); $e = $raw.LastIndexOf('}')
              if ($s -ge 0 -and $e -gt $s) {
                # Round-trip the whole submission -- update is a full replace, so
                # only releaseNotes changes and the uploaded package is preserved.
                $obj = $raw.Substring($s, $e - $s + 1) | ConvertFrom-Json
                $read1500 = { param($f) $t = (Get-Content $f -Raw).Trim(); if ($t.Length -gt 1500) { $t.Substring(0, 1500) } else { $t } }
                $enFile = "$PWD/storenotes.en.md"; $zhFile = "$PWD/storenotes.zh.md"
                $listed = @($obj.listings.PSObject.Properties | Where-Object { $_.Value.baseListing })
                foreach ($p in $listed) {
                  # Give each listing its own language when there is more than one
                  # listing and a matching split exists; a single-listing app
                  # keeps the bilingual note so nothing is dropped.
                  $f = if ($listed.Count -gt 1 -and $p.Name -like 'zh*' -and (Test-Path $zhFile)) { $zhFile }
                       elseif ($listed.Count -gt 1 -and $p.Name -notlike 'zh*' -and (Test-Path $enFile)) { $enFile }
                       else { $notesFile }
                  $p.Value.baseListing.releaseNotes = (& $read1500 $f)
                }
                msstore submission update $storeId ($obj | ConvertTo-Json -Depth 100)
              } else {
                Write-Host 'could not parse submission JSON; keeping previous notes'
              }
            } catch { Write-Host "release-notes update skipped: $_" }
            $global:LASTEXITCODE = 0

            msstore submission publish $storeId
            if ($LASTEXITCODE) { throw 'msstore submission publish (commit) failed' }
          } else {
            # No curated notes for this tag: package-only publish (commits).
            msstore publish $msix -id $storeId
            if ($LASTEXITCODE) { throw 'msstore publish failed' }
          }
