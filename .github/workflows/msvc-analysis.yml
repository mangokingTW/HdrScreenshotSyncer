name: MSVC analysis

# The Microsoft compiler's own static analyzer, complementary to CodeQL: it knows
# the Win32 API this program lives on (handle misuse, wrong-sized structures,
# ignored return codes). Its SARIF goes to the same Security tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'installer/**'
      - 'packaging/**'
      - 'tools/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
      - 'installer/**'
      - 'packaging/**'
      - 'tools/**'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Run MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ github.workspace }}/build
          buildConfiguration: Release
          ruleset: NativeRecommendedRules.ruleset

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}
